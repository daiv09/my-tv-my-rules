# Free My TV settings. build.sh copies this file to config.properties the first time; edit that one and rebuild.

# Simkl app client id (https://simkl.com/settings/developer/) — live trending movies and TV on the home screen.
simkl_client_id=

# Optional: TMDB instead of Simkl (themoviedb.org/settings/api). Simkl wins when both are set.
tmdb_key=

# Your country (two letters): for TMDB picks only — which titles are on which streaming app. US, GB, IN, BR...
tmdb_region=US

# Your city, for the weather and the sunset that turns the home screen dark at night (decimal degrees).
latitude=40.7128
longitude=-74.0060
# Optional: the name shown on the weather card (empty = "Weather").
city=

# true leaves cartoons and anime (TMDB's Animation genre) out of the picks.
hide_animation=false

# auto (follows the TV), or a language in app/assets/i18n (en, pt, es, de, ru, fr, ja, zh-CN…)
language=auto

# true shows cryptocurrency prices from Binance on the home screen and screensaver.
show_crypto=true

# Crypto prices: USD, BRL, EUR... (used only when show_crypto=true)
# (a currency Binance has no pairs in, like INR, shows the prices in dollars)
currency=USD

# C, F, or auto (Fahrenheit when the TV is set to the US)
temperature=auto

# true also turns off Google Assistant ("Ok Google"); the remote's mic button stops working
disable_assistant=false

# Streaming services to leave out of the picks even when their app is on the TV, comma separated (TMDB mode):
# netflix, prime, disney, hulu, paramount, peacock, globoplay, max, appletv, hotstar, okko, crunchyroll, oneplay.
hide_services=

# LG and Samsung: apps to leave out of the shelf, All Apps and the picks, comma separated, by id or name.
hide_apps=

# Fire TV / Android TV: open Free My TV ~25 s after boot (HomeReceiver).
boot_launch_home=false

# Phone browser remote at http://<TV IP>:8080 while Free My TV is open (Fire TV: FireHomeActivity).
lan_remote=false

# Optional: free Watchmode key — deep links into streaming apps (TMDB picks only).
watchmode_key=
